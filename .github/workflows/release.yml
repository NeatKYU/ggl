name: release

# v로 시작하는 태그를 올리면 (예: git tag v0.2.0 && git push origin v0.2.0)
# Apple Silicon + Intel 겸용 앱을 빌드해서 GitHub Releases에 올린다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust 설치
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 테스트
        run: cargo test

      - name: 빌드 (Apple Silicon + Intel)
        run: ./bundle.sh --universal --zip

      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "ggl $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
